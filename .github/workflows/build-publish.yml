# ──────────────────────────────────────────────────────────────────────
#  Custom OmniRoute image → public GHCR
#
#  Builds deploy/Dockerfile (runner-base) and pushes to
#  ghcr.io/eliteraihan2nd/omniroute-custom:custom  (public package).
#
#  Adapted from the upstream fork-publish workflow that was removed in
#  5494f92a (build-fork.yml). Retargeted to this repo's custom deploy
#  Dockerfile — no Docker Hub, no Trivy gate (public personal image).
#
#  Tags: :custom (floating — what the Dokploy stack follows), :v<package.json
#  version> (immutable, one per upstream point — pin a deploy to THIS), and
#  :sha-<sha> (same commit, discoverable).
#
#  Triggers:
#    - push to `custom`: the branch is the deployable artifact's source of truth.
#    - manual workflow_dispatch (rebuild the same commit).
#
#  Do NOT re-add a `workflow_run: ["Build App"]` trigger. `.github/workflows/
#  build.yml` is `workflow_dispatch`-only since upstream #11946 (the hosted
#  runner cannot build this tree), so that chain never fired from a push and
#  every publish needed a hand-dispatched Build App run first.
#
#  Jobs:
#    - lint: cheap pre-publish gate (lint + core typecheck) on ubuntu-latest.
#      The build job `needs: lint`, so a broken commit fails before the
#      ~8 GB image build runs.
#    - build: build + push to GHCR.
#
#  Auth: pushes using GITHUB_TOKEN (packages: write granted at job level).
#        Dokploy pulls using a CLASSIC PAT with `read:packages` only
#        (set in Dokploy → Registry → GHCR). No repo scope needed.
#
#  Visibility: GHCR creates the package PRIVATE by default. The Packages
#  REST `PATCH .../visibility` and GraphQL `setPackageVisibility` are NOT
#  served for USER-namespaced container packages (both 404 even for the owner
#  with write:packages). So visibility is set ONCE, MANUALLY, in the GitHub
#  UI: repo → Packages → omniroute-custom → Settings → Change visibility →
#  Public. It is package-level and persists across all later pushes. The
#  PKG_PAT secret / auto-flip step was removed for this reason.
# ──────────────────────────────────────────────────────────────────────

name: Build & Publish Custom Image

on:
  push:
    branches: [custom]
  workflow_dispatch:

# One publish per ref: the floating :custom tag only ever needs the newest build,
# and a push storm used to fan out concurrent ~8 GB image builds (upstream #11976).
# Same shape as upstream v3.8.52's docker-publish.yml.
concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: read-only at top level; the build job grants
# packages: write itself (Scorecard TokenPermissions).
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/eliteraihan2nd/omniroute-custom

# Pre-publish sanity gate: lint + core typecheck on a cheap runner, so a
# broken commit fails FAST (minutes) instead of only when the full ~8 GB
# image build runs. The build job waits on this; if lint fails, the image
# is never built or pushed.
jobs:
  lint:
    name: Lint + Typecheck (custom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Upstream v3.8.52 (#16782): deliver the ONNX install skip through
          # explicit env — skips the native ONNX install in CI.
          ONNXRUNTIME_NODE_INSTALL: "skip"

      - name: Node runtime check
        run: npm run check:node-runtime

      - name: Lint
        run: npm run lint

      - name: Core typecheck
        run: npm run typecheck:core

      # The two steps below are the ONLY checks that reach the mirror-owned layer:
      # `next build` keeps upstream's `typescript.ignoreBuildErrors: true` and
      # `typecheck:core` is a curated 27-file list that excludes every custom file.
      # See scripts/check/custom-layer-types.mjs.
      - name: Mirror-layer typecheck
        run: node scripts/check/custom-layer-types.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Mirror-layer unit tests
        env:
          DISABLE_SQLITE_AUTO_BACKUP: "true"
        run: >
          node --max-old-space-size=8192 --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-force-exit --test-concurrency=4
          tests/unit/exa-fetch.test.ts
          tests/unit/tavily-fetch.test.ts
          tests/unit/serper-pagination.test.ts
          tests/unit/compression/lite.test.ts
          tests/unit/db/stats-virtual-table.test.ts
          tests/unit/lib/resilience-settings-schema-global-concurrent.test.ts

  build:
    name: Build and Push (linux/amd64)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth for the version tag: the snapshot's own package.json
      # (bumped by the upstream tag it mirrors), so a rebase cannot forget it.
      - name: Read app version
        id: ver
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=custom
            type=raw,value=v${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=omniroute-custom
            org.opencontainers.image.description=Unified AI proxy/router — custom fork image
            org.opencontainers.image.version=v${{ steps.ver.outputs.version }}
            org.opencontainers.image.url=https://github.com/eliteraihan2nd/OmniRoute-custom
            org.opencontainers.image.source=https://github.com/eliteraihan2nd/OmniRoute-custom
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          # Memory plan — mirrors upstream v3.8.52's docker-publish.yml, which
          # publishes with 12288 and NOT the Dockerfile's 6144 default:
          #   OMNIROUTE_USE_TURBOPACK=0     webpack (Docker escape hatch; the
          #                                 v3.8.27 Turbopack panic still bites
          #                                 on long cold builds)
          #   OMNIROUTE_BUILD_MEMORY_MB=12288 V8 heap for the production pass
          #
          # Measured, not guessed: on this tree the webpack pass peaks at
          # ~10.3 GB RSS (measured locally with /usr/bin/time -v, 2026-09-30).
          # At the 6144 default the build died at ~4.5 min with "FATAL ERROR:
          # Ineffective mark-compacts near heap limit" during "Creating an
          # optimized production build" (runs 36689547185, 36694208927).
          # 12288 leaves room for that peak plus buildkit/page-cache on the
          # 15.6 GB runner. OMNIROUTE_BUILD_WORKERS stays at its Dockerfile
          # default of 2 (CIRCLE_NODE_TOTAL=2 → 1 page-data worker).
          #
          # NOTE: never put `#` comments inside build-args — Docker passes each
          # line through as a literal `--build-arg` value.
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache strategy: type=inline embeds the build cache inside the
          # pushed image itself — there is NO separate cache-service export
          # step, so the "exporting to GitHub Actions Cache" hang (seen on
          # type=gha,mode=max after the v3.8.49 layer churn) cannot occur.
          # Next run pulls cache from the previous :custom image.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:custom
          cache-to: type=inline

      # NOTE: no auto-redeploy step. Trigger the Dokploy deploy manually
      # after the workflow completes, OR set up a Dokploy AutoDeploy
      # webhook and add a curl POST here if you later want automatic pulls.
